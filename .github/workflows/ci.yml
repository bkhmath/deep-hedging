name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # The CPU wheel explicitly: the default index would pull the CUDA build,
        # which is two gigabytes and useless on a runner with no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        # The whole suite runs on simulated paths and a synthetic option surface,
        # so it needs no network access and no market-data credentials.
        run: pytest -q

      - name: Run the study offline
        # Proves the pipeline works end to end on a clean checkout with no cached
        # quotes, which is what a reader cloning the repository will do first.
        run: |
          python scripts/run_study.py --quick --synthetic --out /tmp/ci-reports
          test -f /tmp/ci-reports/summary.md
          test -f /tmp/ci-reports/figures/learned_vs_delta.png
          test -f /tmp/ci-reports/figures/risk_vs_cost_entropic.png
